    People with phosphatase and tensin homolog deleted on chromosome 10 (PTEN) hamartomatous tumor syndromes (PHTS)
    have a mutation in one of their genes called PTEN that can lead to benign tumors called hamartomas throughout
    the body. This puts them at increased risk for breast, thyroid and endometrial cancer.


    People with a PTEN mutation have increased activity of proteins such as protein kinase B (AKT) and mammalian
    target of rapamycin (mTOR), which may be responsible for tumor growth and their increased risk of these cancers.


    Experiments show that a drug called sirolimus, which is used to prevent the immune system from rejecting transplanted
    organs, can inhibit cancer cell growth by blocking the mTOR protein.


    Objectives:


    To test the ability of sirolimus to decrease the activity of proteins that are regulated by mTOR in both benign
    and cancerous tumor tissue.


    Eligibility:


    People 18 years of age and older with Cowden syndrome or other PHTS.


