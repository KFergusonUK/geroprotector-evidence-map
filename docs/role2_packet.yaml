  title: 'Taurine as an Anti-Manic Agent: A Double-Blind, Placebo-Controlled Study in Adolescents With Bipolar Disorder'
  summary: 'Recently, McLean hospital conducted a 4 month taurine study which showed a reduction in mania ratings.
    As a follow-up to the preliminary taurine study, and complementary to the currently ongoing double-blind, placebo-controlled
    trial for taurine in adults with bipolar disorder, this study will target adolescent bipolar subjects (type
    I) with symptoms of mania or mixed mania. To our knowledge, this would be the first study to evaluate the effects
    of the novel compound taurine in adolescent subjects with bipolar disorder.


    We hypothesize there will be a positive response in some adolescents from taurine treatment, and this positive
    response will be greater than that expected by chance. This study may demonstrate that taurine is a well-tolerated
    and effective adjunct treatment for mania in bipolar disorder.'
