  title: The Safety and Efficacy of Empagliflozin in Patients With End-stage Renal Disease and Heart Failure With
    Preserved Ejection Fraction - a Randomized Controlled Trial
  summary: The presence of CKD has been linked to the development of HFpEF. Currently, the treatment for HFpEF is
    limited. SGLT2i are one of the few drug classes that have proven efficacy in HFpEF in randomized controlled
    trials. The results of mechanistic studies suggest that the benefits of SGLT2i on diastolic heart failure are
    independent of their glycosuric actions and may still be present in anuric subjects. Despite the significance
    of HFpEF in patients with CKD, patients with advanced kidney disease have been excluded from studies investigating
    anti-heart failure drugs. The effects of SGLT2i in patients under maintenance dialysis are largely unknown.
    Past pharmacokinetics and pharmacodynamics studies on empagliflozin in patients with end-stage renal disease
    (ESRD) demonstrated that the use of empagliflozin in patients with ESRD seemed safe, yet its efficacy remains
    to be explored.
  label: null
