  study_type: OBSERVATIONAL
  title: 'Sex Related Outcomes in Oral vs. Subcutaneous Semaglutide in Type 2 Diabetes Mellitus: A 12-month Real-world
    Study'
  summary: This real-world, comparative cohort study aims to evaluate the 12-month effectiveness of oral versus
    subcutaneous semaglutide in patients with type 2 diabetes mellitus (T2D), with a specific focus on sex-based
    differences in metabolic response. A total of 212 patients were enrolled and evenly assigned to either oral
    or subcutaneous semaglutide. The primary outcome was the change in HbA1c, while secondary outcomes included
    variations in weight, lipid profile, liver function, and hepatic steatosis index. Subcutaneous semaglutide resulted
    in greater improvements in HbA1c, weight, and LDL cholesterol in men, while women exhibited a more favorable
    hepatic response. These findings support the need for sex-specific considerations in T2D therapy personalization.
  label: null
