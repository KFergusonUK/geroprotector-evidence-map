  title: Metformin for Preventing Frailty in High-risk Older Adults
  summary: Frailty is a geriatric syndrome which leads to poor health outcomes in older adults, such as falls, disability,
    hospitalization, institutionalization, and death. Due to the dramatic growth in the U.S. aging population and
    the health care costs associated with frailty (estimated at more than $18 billion per year), frailty is a major
    health care problem. There has been little research into potential pharmacologic interventions that would delay
    or reduce the incidence of frailty. Thus, the major goal of this study is to test metformin as a novel intervention
    for the prevention of frailty. The investigators propose that diabetes/insulin resistance and inflammation are
    major contributors to frailty, and that the use of metformin to modulate diabetes/insulin resistance and inflammation
    will prevent and/or ameliorate the progression of frailty.
  label: null
