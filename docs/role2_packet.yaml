  title: Gut Microbiomes and Viromes in Patients With Metabolic Syndrome
  summary: Metabolic syndrome (MS) is defined by a manifestation of cardiometabolic risk factors including high
    blood pressure, glucose and triglycerides, low high-density lipoprotein (HDL) cholesterol, and abdominal obesity.
    It is closely associated with other diseases such as fatty liver and gouty arthritis. In recent years there
    is evidence that gut microorganisms are intimately linked to health and wellbeing. Here, the investigators hypothesize
    that gut microorganisms are involved in the regulation and/or onset of MS and its symptoms.
  label: null
