  title: 'HER2HEART-US: Primary Prevention of Cardiotoxicity in Breast Cancer Patients Receiving HER2-directed Therapy:
    a Pilot 2x2 Factorial Randomized Controlled Trial'
  summary: 'Ten to 15% of patients with breast cancer are HER2 positive, with treatment focused on targeting the
    HER2 receptor. Although these treatments are generally well tolerated, they are associated with an increased
    risk of cardiomyopathy. There are currently no treatments proven to prevent the cardiotoxicities associated
    with HER2-targeted therapy, but there is convincing preclinical data demonstrating that prophylactic treatment
    with a beta blocker (BB) and/or an SGLT2 inhibitor (SGLT2i) may each independently prevent cardiotoxicity and
    HER-targeted treatment interruptions.


    The proposed pilot study will assess the feasibility and preliminary efficacy and safety of therapy with both
    a beta blocker (carvedilol) and an SGLT2 inhibitor (empagliflozin), alone and in combination, in a population
    initiating HER2-directed therapy for HER2+ breast cancer.


    The hypotheses being tested in this study are:


    1. It is feasible to recruit 20-40 patients over 6 months

    2. There are no differences in tolerability and safety between participants taking carvedilol and/or empagliflozin
    and those receiving usual care.'
  label: null
  note: ''
