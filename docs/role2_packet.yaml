  title: Study on the Effect of Metformin in Improving Cardiac Function After Implantation of Left Ventricular Assist
    Devices
  summary: 'This study investigates whether metformin, compared with placebo, improves cardiac function in patients
    after Left Ventricular Assist Device (LVAD) implantation. Metformin is a widely used oral medication for type
    2 diabetes, but emerging evidence suggests it may have beneficial effects on cardiac metabolism and function
    independent of its glucose-lowering effects. This is a prospective, multicenter, randomized, double-blind, placebo-controlled
    trial. A total of 108patients undergoing LVAD implantation will be enrolled from 5 centers in China. Eligible
    participants will be randomly assigned in a 1:1 ratio to receive either metformin or placebo for 12 months.


    The primary outcome is the incidence of Full Responder at 12 months post-implantation. A Full Responder is defined
    as meeting all of the following four criteria: (1) left ventricular ejection fraction (LVEF) ≥40% and left ventricular
    end-diastolic diameter (LVEDD) ≤6.0 cm (Utah-Inova Responder criteria); (2) soluble ST2 (sST2) ≤100 ng/mL at
    both 6 months and 12 months post-implantation; (3) absolute value of left ventricular global longitudinal strain
    (GLS) ≥12% at 12 months post-implantation.


