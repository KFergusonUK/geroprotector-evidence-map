  title: A Phase II Trial of Non-Myeloablative Conditioning and Transplantation of Partially HLA-Mismatched and
    HLA-Matched Bone Marrow for Patients With Sickle Cell Anemia and Other Hemoglobinopathies
  summary: 'RATIONALE: Giving low doses of chemotherapy, such as fludarabine and cyclophosphamide, and total-body
    irradiation before a donor bone marrow transplant helps stop the growth of abnormal cells. It also helps stop
    the patient''s immune system from rejecting the donor''s stem cells. When the healthy stem cells from a donor
    are infused into the patient they may help the patient''s bone marrow make stem cells, red blood cells, white
    blood cells, and platelets. Sometimes the transplanted cells from a donor can make an immune response against
    the body''s normal cells. Giving sirolimus and mycophenolate mofetil after transplant may stop this from happening.


    PURPOSE: This phase II trial is studying how well giving fludarabine and cyclophosphamide together with total-body
    irradiation followed by a donor bone marrow transplant works in treating patients with sickle cell anemia and
    other blood disorders.'
  label: null
