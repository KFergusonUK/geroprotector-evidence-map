    lymph, respectively. Respiratory failure, lung collapse (pneumothorax), and pleural effusions (chylothorax)
    are hallmarks of the disease. This study will evaluate the safety and effectiveness of sirolimus, an inhibitor
    of the mTOR pathway, in stabilizing or improving lung function in people with LAM.
  label: null
  note: ''
