  summary: This is a multicenter, randomized, Open-label Phase 3 clinical study comparing the efficacy and safety
    of IBI362 6 mg OW versus Semalgutide 1 mg OW in obese(BMI≥28kg/m2) early T2D subjects. Subjects will be randomly
    assigned to IBI362 6 mg and Semalgutide 1 mg groups for 32 weeks (active-controlled treatment period). In the
    extension period, participants originally on mazdutide were assigned to continue for an additional 24 weeks
    with mazdutide 9 mg or 6 mg based on whether they achieved the weight-loss target. All study treatment will
    be administered once-weekly and subcutaneously. The entire trial cycle includes a 2-week screening period, a
    32-week active-controlled treatment period, a 24 week extension period and a 4-week drug withdrawal safety follow-up
    period.
