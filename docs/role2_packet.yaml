  study_type: INTERVENTIONAL
  title: 'Semaglutide 2.4 mg Once Weekly for Recurrent Weight Gain After Metabolic and Bariatric Surgery (RESURGE):
    a Randomized, Double-Blind, Placebo-Controlled Trial'
  summary: 'Metabolic and bariatric surgery (MBS) is the most effective durable treatment for severe obesity, yet
    a clinically meaningful proportion of patients experience recurrent weight gain after an initially successful
    operation. Until recently, research and care in this area were limited by the absence of standardized definitions:
    reported prevalence of weight recurrence ranged from under 10% to over 90% depending on the metric and threshold
    applied, and treatment decisions varied by provider.


    In 2026, an international two-round modified Delphi study of 66 experts across surgery, obesity medicine, gastroenterology,
    endocrinology, dietetics, and psychology (Wills et al.) established consensus definitions. The consensus specifies:
    (i) percentage total weight loss (%TWL) as the preferred measurement approach (94.6% agreement); (ii) surgical
    non-response as \<10% TWL at 12 months (73.0%); (iii) recurrent weight gain as regain of more than 25% of lost
    weight from nadir (70.3%); and (iv) a change of up to 10% in percentage excess weight loss from nadir as a normal
    physiologic fluctuation not requiring intervention (83.8%). The consensus also endorsed ''suboptimal'' as the
    preferred terminology '
  label: null
  note: ''
