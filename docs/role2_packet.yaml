  title: A Phase Ib/II, Open-label, Multicenter, Randomized Umbrella Study Evaluating the Efficacy and Safety of
    Multiple Treatment Combinations in Patients With Metastatic Breast Cancer (Morpheus-panBC)
  summary: 'This is an umbrella study evaluating the efficacy and safety of multiple treatment combinations in participants
    with metastatic or inoperable locally advanced breast cancer.


    The study will be performed in two stages. During Stage 1, seven cohorts will be enrolled in parallel in this
    study:


    Cohort 1 will consist of programmed death-ligand 1 (PD-L1)-positive participants who have received no prior
    systemic therapy for metastatic or inoperable locally advanced triple-negative breast cancer (TNBC) (first-line
    \[1L\] PD-L1+ cohort).


    Cohort 2 will consist of participants who had disease progression during or following 1L treatment with chemotherapy
    for metastatic or inoperable locally-advanced TNBC and have not received cancer immunotherapy (CIT) (second-line
    \[2L\] CIT-naïve cohort).


    Cohort 3, 5, 6 and 7 will consist of participants with locally advanced or metastatic hormone receptor-positive
    (HR+), human epidermal growth factor receptor 2 (HER2)-negative disease with one or more PIK3CA mutations.


    Cohort 4 will consist of participants with locally advanced or metastatic HER2+ /HER2-low disease with one or
    more PIK3CA mutations who had disease progression on standard-of-care therap'
  label: null
