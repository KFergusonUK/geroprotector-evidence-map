  title: Metformin to Augment Low Milk Supply in Pre-diabetic Mothers, a Phase I/II Randomized Clinical Trial
  summary: Most new mothers in the United States will start off breastfeeding. For some mothers, despite following
    best practices, they are not able to meet their breastfeeding goals due to unexplained low milk supply. At the
    same time, nearly 1 in 4 new mothers are pre-diabetic (elevated blood sugar, but not yet diabetic). My progression
    of research suggests that the same metabolic factors causing pre-diabetes may also be causing low milk supply.
    Metformin is a widely prescribed drug to treat high blood sugar. This study is a preliminary, small scale randomized
    trial designed to test for a trend in the hypothesis that metformin is safe and potentially effective in treating
    low milk supply in insulin resistant and pre-diabetic mothers.
