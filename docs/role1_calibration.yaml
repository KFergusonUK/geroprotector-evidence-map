- id: C4
  nct_id: NCT07785934
  registry_url: https://clinicaltrials.gov/study/NCT07785934
  question: Role of metformin in this trial (the intervention object below names it)
  compound: metformin
  intervention_index: 1
  intervention:
    type: DRUG
    name: Metformin hydrochloride
    otherNames: null
    description: Oral administration. Metformin hydrochloride will be given as twice-daily doses for 7 consecutive
      administrations.
    armGroupLabels:
    - UBT251
  all_interventions:
  - UBT251
  - Metformin hydrochloride
  - Warfarin Sodium
  - Atorvastatin calcium
  - Digoxin
  arm_groups:
  - label: UBT251
    type: EXPERIMENTAL
    description: 'This study contains two cohorts. Cohort 1: Participants will first receive multiple-dose metformin,
      then a single-dose warfarin after a 7-day washout period, with PK/PD sampling for both treatments. Following
      a 20-week weekly dose-escalation phase of UBT251, metformin will be administered 24 hours after the 5th consecutive
      fixed-dose UBT251 injection, and warfarin will be given 24 hours after the 6th injection. Dosing and PK/PD
      sampling procedures will match those of the single-drug phase.


      Cohort 2: Participants will receive single-dose atorvastatin and digoxin separated by a 7-day washout period,
      with PK sampling for each drug. After the 20-week UBT251 weekly dose-escalation phase, atorvastatin will be
      given 24 hours after the 5th consecutive fixed-dose UBT251 injection, and digoxin will be administered 24
      hours after the 6th injection. PK sampling procedures will be consistent with those of the single-drug treatment
      phase.'
    interventionNames:
    - 'Drug: UBT251'
    - 'Drug: Metformin hydrochloride'
    - 'Drug: Warfarin Sodium'
    - 'Drug: Atorvastatin calcium'
    - 'Drug: Digoxin'
  study_type: INTERVENTIONAL
  title: A Phase 1, Open-Label, Drug-Drug Interaction Study to Evaluate the Effect of UBT251 on the Pharmacokinetics
    of Single Oral Doses of Metformin, Warfarin, Atorvastatin, and Digoxin in Overweight or Obese Participants.
  summary: 'This is a Phase I, open-label, two-cohort study designed to evaluate the drug-drug interaction potential
    of multiple-dose UBT251 Injection in adult participants with overweight or obesity.


    The primary objective of Cohort 1 is to evaluate the effect of UBT251 Injection on the pharmacokinetic (PK)
    profiles of metformin and warfarin. The secondary objectives of Cohort 1 are to assess the influence of UBT251
    Injection on the pharmacodynamic (PD) characteristics of warfarin, to evaluate the safety of UBT251 Injection
    administered alone, as well as metformin and warfarin administered alone or in combination with UBT251 Injection,
    and to characterize the PK, PD, and immunogenicity profiles following repeated UBT251 Injection dosing.


    The primary objective of Cohort 2 is to evaluate the effect of UBT251 Injection on the PK profiles of atorvastatin
    and digoxin. The secondary objectives of Cohort 2 are to evaluate the safety of UBT251 Injection alone, atorvastatin
    and digoxin alone, and their combination with UBT251 Injection, as well as to assess the PK, PD, and immunogenicity
    characteristics after multiple administrations of UBT251 Injection.'
  label: null
  note: ''
