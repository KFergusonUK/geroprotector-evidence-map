# Refresh and change detection (SPEC §11). A diff, not a monitor:
# refresh sources, snapshot derived-cell membership, compare with the previous run.
# Opens an issue and commits a dated changelog ONLY when v_cell_transitions is
# non-empty for this run; otherwise it leaves no trace beyond the saved state.
#
# State: the SQLite database (raw layer, fetch log, snapshot history, reviews) is
# saved after every run as a NEW dated release, pipeline-state-YYYY-MM-DD-run<N>,
# never overwritten. Retention: newest 12, then the newest of each month, forever
# (agesdk/state_backups.py). One bad upload can cost at most one run.
name: refresh

on:
  # MANUAL ONLY for now (SPEC §11.5). Until trial normalisation (§7 step 5) exists,
  # v_cell_transitions cannot fire, so scheduled runs would only produce near-empty
  # output. Re-enable after §7 step 5, reassessing cadence rather than defaulting to
  # weekly, by uncommenting this one line:
  # schedule: [{cron: "17 6 * * 1"}]
  workflow_dispatch: {}

permissions:
  contents: write            # commit changelog, upload state asset
  issues: write              # open an issue on transitions

concurrency:
  group: refresh
  cancel-in-progress: false  # never run two refreshes against the same state

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install "PyYAML==6.0.1"

      - name: Restore state
        run: |
          mkdir -p data
          LATEST=$(gh release list --limit 500 --json tagName | python -m agesdk state-backups latest)
          if [ -n "$LATEST" ]; then
            echo "Restoring from $LATEST"
            gh release download "$LATEST" --pattern 'agesdk.sqlite.gz' --dir data
            gunzip -f data/agesdk.sqlite.gz
          else
            echo "No saved state: this run is the baseline and will report no transitions."
          fi

      - name: Tests
        run: python -m unittest discover -s tests -t .

      - name: Refresh
        id: refresh
        run: |
          python -m agesdk init-db
          python -m agesdk refresh --changelog-dir changelog

      # Publish before saving state: if saving fails, the next run repeats this
      # changelog (a duplicate) rather than silently skipping it (a loss).
      - name: Commit changelog and open issue
        if: steps.refresh.outputs.transitions != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add changelog/
          git commit -m "Evidence map changelog: ${{ steps.refresh.outputs.transitions }} transition(s)"
          git push
          gh issue create \
            --title "Evidence map: ${{ steps.refresh.outputs.transitions }} cell transition(s) — $(date -u +%F)" \
            --body-file "${{ steps.refresh.outputs.changelog }}"

      - name: Save state (new dated release)
        if: always() && steps.refresh.outcome != 'skipped'
        run: |
          RUN_ID="${{ steps.refresh.outputs.run_id }}"
          TAG=$(python -m agesdk state-backups tag --run-id "${RUN_ID:-${{ github.run_id }}}")
          gzip -kf data/agesdk.sqlite
          gh release create "$TAG" data/agesdk.sqlite.gz --latest=false --prerelease \
            --title "Pipeline state $TAG" \
            --notes "SQLite state after weekly refresh run ${RUN_ID:-?} (outcome: ${{ steps.refresh.outcome }})."
          # Prune only once the new backup is confirmed present.
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx 'agesdk.sqlite.gz'
          gh release list --limit 500 --json tagName | python -m agesdk state-backups prune | \
            while read -r OLD; do
              [ -n "$OLD" ] && gh release delete "$OLD" --yes --cleanup-tag
            done
