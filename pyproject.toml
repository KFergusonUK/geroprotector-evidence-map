[project]
name = "agesdk"
version = "0.1.0"
description = "Geroprotector Human Evidence Map: animal lifespan evidence linked to human trial dossiers"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agesdk", "agesdk.sources"]

[tool.setuptools.package-data]
agesdk = ["schema.sql"]
