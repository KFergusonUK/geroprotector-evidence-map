    chembl_id: null
    atc_codes: null
    drugage_names: [Rapamycin]
    must_match: [rapamycin, Rapamycin, sirolimus, Sirolimus, Rapamune, AY-22989, AY 22989, RAPA, Fyarro,
                 "Sirolimus 0.5 mg", "Rapamune 2mg tablet", "nab-sirolimus", "encapsulated rapamycin"]
    must_not_match: [everolimus, Everolimus, temsirolimus, zotarolimus, ridaforolimus, umirolimus,
                     tacrolimus, FK506, pimecrolimus, RAD001, Afinitor, Zortress, Torisel]
    needs_review: ["sirolimus-eluting stent", "rapamycin topical"]
    notes: >
      Rapalogs are different molecules; never merge. A future 'analogue_of' link may relate
      them. Drug-eluting stents deliver sirolimus locally to the coronary artery; whether a
      stent trial counts as a sirolimus trial is a scope decision, so it goes to review.
      nab-sirolimus (Fyarro) is a formulation of the same molecule.
    review: {resolved_by: claude-draft, reviewed_by: null, reviewed_at: null}

