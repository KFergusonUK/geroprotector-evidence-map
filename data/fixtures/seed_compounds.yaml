# Seed compound fixture — hand-resolved ground truth for the resolver (SPEC §6, §7 step 1).
#
# STATUS: DRAFT. Identifiers below were looked up in PubChem on 2026-11-11 and every
# lookup is stored in raw_response (source='pubchem'). Every entry still needs a
# human sign-off: set review.reviewed_by / reviewed_at when you have checked it.
#
# Conventions
#   canonical_name   ASCII, lowercase, the name a reader of the map recognises.
#                    Identity is the full 27-char InChIKey, never the name, never the
#                    14-char first block (17a- and 17b-estradiol share it).
#   pubchem_cid      The parent compound (salts and hydrates collapsed, §5.1).
#   chembl_id,
#   atc_codes        PENDING: the ChEMBL API was returning HTTP 500s / timeouts on
#                    2026-11-11. ATC codes must come from ChEMBL (SPEC §5.5), so they
#                    are null until `python -m agesdk fixture-chembl` succeeds.
#   drugage_names    Exact strings from the DrugAge CSV, byte-for-byte (note U+2010
#                    hyphens in 17-alpha-estradiol). Checked by tests against the raw layer.
#   must_match       Strings the resolver MUST map to this compound.
#   must_not_match   Strings the resolver MUST NOT map to this compound (precision tests).
#   needs_review     Strings the resolver must route to manual review, never auto-map
#                    (combination products, mixtures, extracts, stereo ambiguity).
#   expected_entry_route  direct | class | excluded
#   expected_itp     positive (>=1 ITP cohort with significant extension) | null_result | untested
#   headline_v1      true if the compound has mammal evidence (v1 headline scope)

fixture_version: 0.1.0
pubchem_checked_at: "2026-11-11"
drugage_version: "Build 5 (2024-11-29); archive sha256 d12f59717de60a207748f53bdbcdb484ed07e30d8608eb8e4a101e2a08d7fa80"

