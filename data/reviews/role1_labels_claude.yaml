    and Cerebral Blood Flow: a Double-blind, Placebo-controlled, Parallel-groups Study in Healthy, Overweight Humans.'
  summary: 'Previous research shows that a diet high in fat has harmful effects on gut health. This increases the
    chance of developing obesity-related diseases (such as type 2 diabetes) and disrupts cognition and mood.


    Research has suggested that gut health can be improved by taking certain supplements, including resveratrol
    (a polyphenol found primarily in red grape skins). Resveratrol has also been shown to improve brain blood flow
    and possibly brain function - however, there is limited research studying this.


    This study will investigate the effects of 12 weeks daily consumption of resveratrol on cognitive function,
    cerebral blood flow, gut microbiota and systemic inflammation in overweight and obese healthy adults.'
  label: experimental
