      tapered to be definitely discontinued by day 100 (sibling donors) or 180 (alternative donor recipients) in
      the absence of GVHD. Sirolimus 6 mg loading dose on day -3, followed by (1)-2 mg daily to a target trough
      level of 5 to 10 ng/mL. Full doses until day 100 (sibling recipients) or 180 (alternative donor recipients).
