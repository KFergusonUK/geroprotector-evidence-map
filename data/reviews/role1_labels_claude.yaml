  title: 'The Use of Senolytic Agent to Improve the Benefit of Platelet-Rich Plasma and Losartan for Treatment of
    Femoroacetabular Impingement and Labral Tear: A Pilot Study'
  summary: 'The purpose is to explore the possible benefit of administration of Fisetin, (a senolytic agent) to
    improve the benefit of Platelet-Rich Plasma and losartan for treatment of femoroacetabular impingement and labral
    tear.


    We believe that giving Fisetin, a senolytic agent, will improve the benefit of PRP by eliminating senescent
    cells and senescence-associated secretory phenotype (SASP), known to exist in PRP. The main objectives of this
    study are to determine if pre- and post-operative administration of a senolytic agent will improve the beneficial
    effects of PRP when used in conjunction with surgical treatment of FAI and/or labral tear, to determine whether
    pre- and postoperative administration of Fisetin is associated with adverse events, and to determine if pre-
    and post-operative administration of Fisetin leads to a decrease in systemic senescence, serum SASP, and fibrotic
    markers.


    Patients suffering from femoroacetabular impingement and labral tear, who are planning to undergo hip arthroscopy
    combined with standard of care intra-operative PRP injection and post-operative losartan administration will
    be recruited from the clinical practice of the Principal Clinical Investigator'
  label: experimental
  note: "vs placebo"
