  title: A Parallel Group Study in Healthy Participants to Quantitate Increases in Subclinical Gastrointestinal
    Blood Loss Following Administration of Aspirin Alone or in Combination With Rivaroxaban or Factor XI Inhibitors
    (REGN9933 or REGN7508)
  summary: 'This study is researching experimental drugs called REGN9933 and REGN7508 (called "study drugs") and
    comparing their effects to approved treatments of rivaroxaban and aspirin (called "standard treatments"). Aspirin
    will be given alone or in combination with the study drugs or the other standard treatments to look at their
    effects on blood loss in the intestines.


    The aim of the study is to see if aspirin alone or the study drugs REGN9933 and REGN7508, when taken with aspirin,
    cause less minor intestinal bleeding than standard treatments rivaroxaban with aspirin.


    The study is looking at several other research questions, including:


    * What side effects may happen from taking the study drug

    * How much study drug is in the blood at different times

    * Whether the body makes antibodies against the study drug (which could make the drug less effective or could
    lead to side effects)'
  label: background
  note: "aspirin in all four arms as the GI-blood-loss challenge; the add-ons differ"
