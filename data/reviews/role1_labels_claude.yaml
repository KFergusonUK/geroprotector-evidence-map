  summary: 'This study is open to adults with chronic kidney disease (CKD) that is at risk of getting worse. People
    who have taken a specific type of medication for kidney disease called SGLT2 inhibitor within 1 month before
    the study or have certain health conditions cannot take part in this study. The purpose of this study is to
    find out whether a medicine called vicadrostat, used in combination with another medicine called empagliflozin,
    works in people with chronic kidney disease.


    In this study, participants are randomly assigned to one of two groups. Participants have an equal chance of
    being assigned to either group. In one group, participants take the 2 study medicines, vicadrostat and empagliflozin,
    every day for 3 months. In the other group, participants take placebo and empagliflozin for the first 1.5 months,
    and then they take vicadrostat and empagliflozin together for the next 1.5 months. The study medicines are taken
    orally as tablets. Placebo tablets look like vicadrostat tablets but do not contain any medicine.


    Participants are in the study for about 4.5 months. During this time, they visit the study site multiple times.
    Doctors regularly test kidney function by measuring spec'
