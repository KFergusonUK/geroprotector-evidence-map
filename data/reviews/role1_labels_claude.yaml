  summary: 'The present project is a multicenter phase II trail aiming at comparing which of the two postgrafting
    immunosuppressive regimens proposed in this study will be best suited to prevent graft-versus-host disease (GVDH).


    The immunosuppressive regimens will consist of: Tacrolimus plus Mycophenolate Mofetil or Tacrolimus plus Sirolimus.
    Before grafting patients will undergo a reduced-intensity conditioning with Fludarabine/total body irradiation
    (TBI) or Fludarabine/Busulfan/anti-thymoglobuline. Following the interim analysis of October 2014, the protocol
