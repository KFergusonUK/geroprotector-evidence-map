  title: Pharmacogenetics of Sodium-dependent Glucose Transporter-2 (SGLT2) Inhibitors
  summary: Sodium-dependent glucose transporter-2 (SGLT2) inhibitors are a new class of anti-diabetic drugs, which
    increase urinary glucose excretion thereby promoting weight loss and decreasing plasma glucose levels. We hypothesize
    that the pharmacodynamic response to SGLT2 inhibitors (specifically canagliflozin) varies among individuals,
    and that a proportion of this inter-individual variation can be explained by genetic variation. This is a pilot
    study in healthy, non-diabetic subjects in whom glucose and other related metabolites in the urine and plasma
    will be measured before and after administration of a single dose of canagliflozin. This will allow us to characterize
    the inter-individual variation in the pharmacodynamic response to canagliflozin as well as determine if changes
    in glucose and other related metabolite levels are associated with variants in various candidate genes.
