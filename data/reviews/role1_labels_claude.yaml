    demand in type 2 diabetes (T2D), can do the same in children at risk of type 1 diabetes (T1D) and thereby prevent
    disease.


    The first phase of adAPT will screen participants aged 5-16 years (inclusive) for islet-related autoantibodies
    who are the siblings or offspring of individuals diagnosed with T1D before the age of 25years in Scotland and
    England.


    There are four principle islet-related antibodies associated with T1D. The presence of two or more confers a
    40% risk of developing T1D in five years. While the presence of none or one antibody carries a similar risk
    for developing T1D to the general population (1 in 500 in 5years).


