  study_type: INTERVENTIONAL
  title: Effect of Dapagliflozin on Cardio-Metabolic Risk Factors in Patients With Type-2 Diabetes
  summary: 'Dapagliflozin is a member of the sodium-glucose cotransporter-2 (SGLT2) inhibitor class antidiabetes
    agents which produces significant and sustained reductions in glycemic parameters in patients with type 2 diabetes
    (T2DM). However, its non-glycemic effects are still largely unknown.


    The investigators will evaluate for the first time the effect of dapagliflozin on multiple cardio-metabolic
    risk markers in one study. So far, no data on the effects of dapagliflozin as well as other SGLT-2 inhibitors
    on subclinical atherosclerosis, endothelial function, inflammatory markers, cytokines and atherogenic lipoproteins
    is available.


    In addition, the investigators will examine microRNAs (miRNAs) implicated in the development and progression
    of atherosclerotic disease. Again, no data is currently available on dapaglifozin''s as well as other SGLT-2
    inhibitors'' effects on miRNAs.


    The results of this study will show for the first time the potential multiple, non-glycemic effects of dapagliflozin,
    reducing multiple cardio-metabolic risk markers, which will ultimately lead to decreased CV risk.


    In addition, specific mechanisms of the dapagliflozin cardiovascular action will be investigated.


    F'
  label: background
  note: "metformin in both arms; dapagliflozin add-on is tested (metformin-alone arm typed PLACEBO_COMPARATOR)"
