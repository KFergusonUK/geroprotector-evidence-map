  title: 'Effects of Empagliflozin on Preventing Fibrosis and Cirrhosis Progression in Nucleos(t)Ide Analogue-treated
    Chronic Hepatitis B Patients With F2-F4 Fibrosis: a Randomized, Double-blind Placebo-controlled Trial'
  summary: 'Chronic hepatitis B (CHB) affects 257million individuals worldwide. In 2017, it caused around 39.7 million
    cases of cirrhosis and 0.4 million cirrhosis-related deaths in 2017. However, there is no specific treatment
    for liver fibrosis/cirrhosis. Although nucleos(t)ide analogues (NAs) profoundly suppress viral replication,
    fibrosis/cirrhosis progression can still occur in NA-treated patients.


    Sodium-glucose cotransporter type-2 (SGLT2) inhibitors are antidiabetic drugs that may prevent fibrosis/cirrhosis
    progression by reducing hepatic steatosis/inflammation, dampening renin-angiotensin aldosterone system (RAAS)
    activation, and reducing fluid retention, effects of which are independent of glycemic control. Clinical studies
    in diabetic patients show SGLT2 inhibitors reduce hepatis steatosis/inflammation, regress ascites (a cirrhotic
    complication), and improve liver function parameters and survival prognosis in terms of model for end-stage
    liver disease (MELD) score. There are currently no randomized controlled trials (RCTs) on role of SGLT2 inhibitors
    in preventing fibrosis/cirrhosis progression in CHB patients. Magnetic resonance elastography (MRE) and transient
