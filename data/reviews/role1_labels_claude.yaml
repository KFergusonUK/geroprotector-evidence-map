  summary: 'This study looks at how the new medicine called NNC0480-0389 works in the body of Chinese men when it
    is given at different doses together with a fixed dose of semaglutide. Participants will get one injection of
    NNC0480-0389 and one injection of semaglutide - which dose of NNC0480-0389 participants get is decided by chance.


    NNC0480-0389 is a new medicine that has not been previously approved. It means that the medicine has not yet
    been approved by the health authorities.


    Semaglutide is a newly approved antidiabetic medicine that helps to lower blood sugar levels in people with
    type 2 diabetes.


    NNC0480-0389 is being developed to be given together with semaglutide. NNC0480-0389 targets a different part
    of the system that regulates sugar levels in the body than semaglutide. Therefore, it is expected that together
    NNC0480-0389 and semaglutide will more effectively lower sugar levels in the blood in people with type 2 diabetes.


