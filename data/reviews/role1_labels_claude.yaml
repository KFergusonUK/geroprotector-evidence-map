  title: Spontaneous Coronary Artery Dissection - Antiplatelet Therapy Intensity in Guided Conservative Management
    (SCAD-ALIGN) Trial
  summary: 'Spontaneous coronary artery dissection (SCAD) is a rare cause of acute coronary syndrome in which blood
    flow to the heart muscle is reduced or interrupted. It predominantly affects women between 30 and 55 years of
    age and typically occurs in the absence of atherosclerosis. For many years, SCAD remained underdiagnosed and
    has only recently been more systematically recognised. The SCAD-ALIGN trial will be the first randomised study
    to systematically compare two antiplatelet treatment strategies in patients with SCAD.


    SCAD is usually not associated with significant atherosclerosis or the classic vessel occlusion caused by a
    blood clot. Instead, bleeding occurs within the wall of a coronary artery, causing the vessel layers to separate
    and thereby impairing or completely obstructing blood flow. Patients develop symptoms of acute myocardial infarction,
    such as chest pain, shortness of breath, or nausea. A characteristic feature is that these symptoms often occur
    in individuals without a prior history or risk of heart disease.


    Platelets play a crucial role in blood clotting but can also accumulate inside blood vessels and further impair
    flow. Antiplatelet medications are used to preven'
  label: background
  note: "ASA in both arms (3 months); arms differ by adding clopidogrel"
