    with empagliflozin 25 mg, compared to treatment with empagliflozin 25 mg in combination with placebo on albuminuria
    in participants with type 2 diabetes and albuminuria.


    In a randomised, placebo-controlled, double-blinded, parallel trial we will include 80 patients with type 2
    diabetes and albuminuria. Patients will start in a run-in phase of 26 weeks with empagliflozin 25 mg alone.
    After that, the patients will be randomised 1:1 to an active treatment period with semaglutide of 26 weeks or
    placebo for 26 weeks.


