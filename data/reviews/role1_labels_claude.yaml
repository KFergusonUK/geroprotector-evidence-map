    interventionNames:
    - 'Drug: Metformin and nizatidine'
  study_type: INTERVENTIONAL
  title: The Pharmacokinetic Interaction Between Metformin and Nizatidine in Healthy Volunteers
  summary: 'This study will address the following question: Does nizatidine affect the pharmacokinetics of metformin
    in healthy volunteers? Recent studies in the Giacomini laboratory have indicated that nizatidine may block metformin
    elimination from the kidney by inhibiting organic cation transporter efflux of metformin. The investigators
    hypothesize that the co-administration of metformin and nizatidine will reduce the renal clearance (CLR) of
    metformin leading to increased plasma concentrations and potential risk for toxicities. Knowledge of the pharmacokinetic
    interaction profile of metformin with organic transporter inhibitors, such as nizatidine, is important to help
    develop safer more effective drug therapy with reduced side effects.'
  label: background
  note: "metformin is the probe substrate; nizatidine is the perpetrator"
