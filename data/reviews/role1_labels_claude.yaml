  title: A Phase II Randomized Study of Interventions for Metabolic Protection Against Cardiometabolic Toxicity
    During Androgen Deprivation Therapy (IMPACT-ADT)
  summary: This phase II trial compares the effect of time-restricted eating (TRE) and glucagon-like peptide-1 (GLP1)
    receptor agonists (RA), semaglutide and tirzepatide, to an American Heart Association (AHA) heart healthy diet
    (HHD) intervention on heart and blood vessel health (cardiovascular system) and how the body processes food
    for energy (metabolic system) in prostate cancer patients undergoing androgen deprivation therapy (ADT). Prostate
    cancer patients who are receiving hormonal therapy (ADT) are at an increased risk of cardiovascular disease.
    This is thought to be due to treatment-related metabolic changes which may result in increased weight, body
    fat, insulin resistance and an increased risk of heart attack, stroke or other heart and blood vessel problems.
    TRE (also known as intermittent fasting) is an eating plan that alternates between fasting and non-fasting periods.
    This approach limits calorie intake to a specific window of time each day. GLP1-RAs, semaglutide and tirzepatide
    are in a class of medications called incretin mimetics. They work by helping the pancreas to release the right
    amount of insulin when blood sugar levels are high. Insulin helps move sugar from the blood
  label: experimental
  note: "semaglutide/tirzepatide arm vs TRE vs diet counselling"
