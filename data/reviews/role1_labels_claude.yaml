  title: Metformin in Alzheimer's Dementia Prevention
  summary: 'MAP will be a multi-center phase 2/3 1:1 randomized controlled trial (RCT) of long-acting metformin
    (reduced mass Glucophage XR) vs. matching placebo in 326 men and women with early and late aMCI, without diabetes,
    not treated with metformin, overweight or obese, aged 55 years to 90 years. The RCT will last 18 months and
    have 4 visits: baseline, 6-months, 12-months, and 18-months. The RCT will be preceded by a screening phase followed
    by randomization and a titration period in which drug/placebo will be titrated from 500 mg a day (one tablet)
    to 2,000 mg a day (4 tablets), in increments of 500 mg (one tablet) every 10 days. Participants will remain
    in the RCT on the tolerated dose, and included in analyses on an intent to treat basis. We expect the attrition
    rate to be 10%/year. Neuropsychological battery, clinical interviews, physical exam, and phlebotomy will be
    conducted at baseline and every 6 months. Brain MRI will be conducted in approximately half of the participants
    (186) twice, at baseline, and after the last study visit at month 18. We will also conduct brain amyloid Positron
    Emission Tomography (PET) using 18F-Florbetaben, and tau PET using 18F-MK6240 in half of the part'
  label: experimental
  note: "vs placebo"
