      Period 2 (10 days): Participants will receive multiple doses of vemircopan from day 1 to day 9. On day 5,
      participants will receive a single dose of OC co-administered with vemircopan.


      There will be a washout period of at least 7 days between the dose of OC in Period 1 and the first dose of
      vemircopan in Period 2.'
