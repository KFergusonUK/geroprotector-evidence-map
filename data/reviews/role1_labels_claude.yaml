- id: 7
  nct_id: NCT05326984
  registry_url: https://clinicaltrials.gov/study/NCT05326984
  question: Role of metformin in this trial (the intervention object below names it)
  compound: metformin
  intervention_index: 0
  intervention:
    type: DRUG
    name: Metformin
    otherNames: null
    description: Metformin will be administered orally to the experimental group by randomization at a dose of 1000mgm2
      per day, with maximum dose of 850mg three times a day, from day -7 to the end of the remission induction period.
    armGroupLabels:
    - Interventional group
  all_interventions:
  - Metformin
  arm_groups:
  - label: Control group
    type: NO_INTERVENTION
    description: This subjets will receive conventional chemotherapy alone. The Remission induction chemotherapy
      includes a steroid pre-phase of 7 days of prednisone 60mgm2SCD. The proper remission induction phase consist
      in prednisone 60mgm2 daily from day 0 to 28; Vincristine 1.5mgm2 on days 0, 7, 14 and 21; Doxorubicin 25mgm2
      on days 0, 7, 21; L-asparaginase 10, 000 Um2 on days 2, 4, 6, 8, 10 and 12. Etoposide 300mgm2 and cytarabine
      300mgm2 on days 22, 25 and 29. Intrathecal chemotherapy is administered on days 0, 7, 14 and 21.
    interventionNames: null
  - label: Interventional group
    type: EXPERIMENTAL
    description: 'This group will receive conventional chemotherapy plus metformin 1000mgm2 per day, with maximum
      dose of 850mg three times a day, from day -7 to the end of the remission induction period.


      The Remission induction chemotherapy includes a steroid pre-phase of 7 days of prednisone 60mgm2SCD. The proper
      remission induction phase consist in prednisone 60mgm2 daily from day 0 to 28; Vincristine 1.5mgm2 on days
      0, 7, 14 and 21; Doxorubicin 25mgm2 on days 0, 7, 21; L-asparaginase 10, 000 Um2 on days 2, 4, 6, 8, 10 and
      12. Etoposide 300mgm2 and cytarabine 300mgm2 on days 22, 25 and 29. Intrathecal chemotherapy is administered
      on days 0, 7, 14 and 21.'
    interventionNames:
    - 'Drug: Metformin'
  study_type: INTERVENTIONAL
  title: Effect of Metformin on ABCB1 and AMPK Expression in Adolescents With Newly Diagnosed Acute Lymphoblastic
    Leukemia
  summary: 'Acute lymphoblastic leukemia, is the most frequent cancer in children and adolescents. Some genes have
    been described to produce drug resistance, as ABCB1 probably by lack of activation of AMPK. Some manuscripts
    have shown that metformin has antitumoral activity, mainly by activation of AMPK.


    This is an experimental one center trial, that pretend analyze the effect of metformin at a dose of 1000mgm2
    per day, on the expression of the ABCB1 and AMPK genes, when is added to conventional induction remission chemotherapy
    in newly diagnosed adolescents with acute lymphoblastic leukemia.'
  label: experimental
  note: "chemo + metformin vs chemo alone"
