      (sibling recipients) or day 42 (alternative donor recipients) at the dose of 15 mg/kg t.i.d. Tacrolimus (Tac)given
      orally at the dose of 0.06 mg/kg bid starting on day -3. The dose adapted according to through whole blood
      values following standard procedures (between 10 and 15 ng/ml the first 28 days and between 5-10 ng/ml thereafter).
      Full doses given until day 100 (sibling recipients) or 180 (alternative donor recipients). Doses tapered to
      be definitely discontinued by day 180 (sibling donors) or 365 (alternative donor recipients) in the absence
      of GVHD.'
