  title: The Effect of Empagliflozin and Metformin on Oxidative Capacity and Microvascular Reactivity of Skeletal
    Muscle in Patients With Type 2 Diabetes Mellitus
  summary: 'The purpose of the study is to compare the effect of empagliflozin, metformin, and the combination of
    both on the oxidative capacity of skeletal muscle and its microvascular reactivity in individuals with newly
    diagnosed type 2 diabetes. As the primary outcome, the investigators selected the change in skeletal muscle
    oxidative capacity and posed the following scientific question: Does empagliflozin significantly improve the
    oxidative capacity of skeletal muscle? The study will enroll 54 individuals with type 2 diabetes in a prospective,
    randomized, interventional, open-label study. Participants will be randomized into 3 equally sized groups: 1)
    a group receiving empagliflozin; 2) a group receiving metformin; and 3) a group receiving a combination of both
    drugs (empagliflozin and metformin). The investigators will analyze the clinical variables of the subjects,
    near-infrared spectroscopy (NIRS) measurements over the flexor digitorum superficialis muscle of the non-dominant
    arm at rest, after submaximal muscular work, and during transient brachial artery occlusion at specified time
