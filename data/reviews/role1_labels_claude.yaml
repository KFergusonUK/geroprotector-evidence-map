  study_type: INTERVENTIONAL
  title: Response of Gut Microbiota in Type 2 Diabetes to Hypoglycemic Agents
  summary: Intestinal microflora refers to the trillions of microorganisms living in our gut, which is considered
    as an independent endocrine organ of human body. Intestinal microbiota plays a very important role in human
    health. The composition of human intestinal microbiota is affected by a variety of factors, including age, living
    region, eating habits, nutrition, probiotics, antibiotics and so on. It is found that the imbalance of intestinal
    microbiota is closely related to the occurrence and development of metabolic diseases including type 2 diabetes
    mellitus (T2DM). There are great differences in the structure and function of intestinal microbiota between
    healthy people and T2DM patients, and recently changes of intestinal microbiota have been observed in pre-diabetes.
    In recent years, it has been found that some commonly used hypoglycemic drugs may regulate and improve the imbalance
    of intestinal flora of T2DM patients, including metformin, α - glucosidase inhibitor, and Glucagon-like peptide-1(GLP-1)
    receptor agonist, which have a positive impact on the short chain fatty acid (SCFAs) producing bacteria. However,
    on the one hand, subjects of those studies were mostly western population
  label: experimental
  note: "one of six hypoglycaemic agents, each arm experimental"
