    known that the compound resveratrol perhaps has the potential to neutralize obesity-induced diseases. Resveratrol
    is already widely used as a food supplement though the precise effects are unknown. This project focuses on
    the effect of Resveratrol on fatty liver disease. The researchers plan to investigate the effects of Resveratrol
    or placebo treatment for 6 months on NAFLD/NASH in obese patients.
