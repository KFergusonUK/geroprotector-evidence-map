    interventionNames:
    - 'Drug: MetFORMIN 500 Mg Oral Tablet'
  study_type: INTERVENTIONAL
  title: Impact of Adding Quercetin or Alpha Lipoic Acid as an Adjuvant Therapy on Clinical and Biochemical Outcomes
    in a Sample of Iraqi PCOS Patients
  summary: 'This study will investigate whether the addition of Quercetin or Alpha-Lipoic Acid (ALA) to standard
    metformin therapy can improve symptoms, hormone levels, metabolic health, and quality of life in women with
    polycystic ovary syndrome (PCOS). Over 3 months, participants will be randomly assigned to one of three groups:
    metformin alone, metformin plus Quercetin, or metformin plus ALA. Researchers will measure changes in hormones,
    blood sugar, cholesterol, and antioxidant markers, as well as quality of life and medication adherence. Physical
    measurements and side effects will also be recorded to assess safety and overall benefit.'
  label: experimental
  note: "quercetin arm vs ALA arm vs metformin-only control"
