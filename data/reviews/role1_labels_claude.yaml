  summary: This study investigates whether the activity of brown adipose tissue (BAT) - a special type of fat that
    burns energy as heat - can predict how well individuals with obesity respond to semaglutide (Wegovy), a once-weekly
    injectable weight loss medication. Participants who are starting semaglutide treatment will undergo ¹⁸FDG-PET/CT
    imaging before and after 24 weeks of treatment. Prior to each PET/CT scan, participants will wear a water-circulating
    cooling vest to activate BAT. By measuring BAT activity at baseline and comparing it with the degree of weight
    loss and metabolic improvement at 24 weeks, the investigators aim to identify BAT as a predictive biomarker
    for personalized obesity treatment.
