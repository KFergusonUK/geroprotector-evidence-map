# Intervention-string resolver rules (SPEC §5.1a, §5.6, §5.9). Versioned: bump on any change;
# every resolver_match row records the version that produced it.
version: resolver-v5
created: "2026-11-18"

# Stripped before comparing a registry string with a fixture synonym, so "Metformin
# hydrochloride 500 mg extended-release tablets" compares as "metformin". Whole words only.
formulation_words: [tablet, tablets, tab, tabs, capsule, capsules, cap, caps, oral, orally, solution,
  suspension, injection, injectable, infusion, iv, intravenous, subcutaneous, sc, im, powder, granules,
  sachet, syrup, drops, extended-release, extended, release, delayed-release, delayed, immediate-release,
  immediate, modified-release, sustained-release, sustained, prolonged-release, xr, er, sr, ir, xl, mr, cr, dr,
  enteric-coated, enteric, coated, film-coated, chewable, effervescent, low-dose, low, high-dose, high,
  dose, doses, dosing, daily, once, twice, weekly, per, day, days, week, weeks, bid, tid, qd, qid,
  mg, g, mcg, ug, ml, iu, kg, generic, brand, tm, supplement, supplements, supplementation, dietary]
salt_words: [hydrochloride, hcl, sodium, potassium, calcium, magnesium, chloride, sulfate, sulphate,
  phosphate, acetate, citrate, tartrate, maleate, mesylate, besylate, fumarate, succinate, carbonate,
  dihydrate, monohydrate, hydrate, anhydrous, salt, free, base]
# A dose needs a unit: bare numbers are kept, because sponsor codes are numbers
# ("BI 10773", "AY-22989", "JNJ-28431754").
dose_pattern: '\b\d+([.,]\d+)?\s*(%|mg/kg|mg/m2|mg/day|mg/d|mg|g|mcg|µg|ug|ml|iu|ppm|mmol|units?)(?=\s|$|/|\))'

# A placebo matching the compound is not the compound (but tells us it is tested elsewhere).
placebo_pattern: '\b(placebo|matching|dummy|sham|vehicle)\b'

# Class-level or regimen names: never auto-matched, even if otherNames list a fixture drug.
class_patterns:
  - '\binhibitors?\b'
  - '\bagonists?\b'
  - '\bantagonists?\b'
  - '\bblockers?\b'
  - '\banalogu?es?\b'
  - '\bstatins?\b'
  - '\bsglt-?2i?\b'
  - '\bglp-?1(ra)?\b'
  - '\bdpp-?4i?\b'
  - '\bace-?i?\b'
  - '\barbs?\b'
  - '\banti-?(diabetic|hypertensive|platelet|coagulant|inflammatory|oxidant)s?\b'
  - '\b(standard|usual|routine|conventional)\s+(of\s+)?(care|treatment|therapy|medication)s?\b'
  - '\bregimens?\b'
  - '\bclass\b'
  - '\bmedications?\b'

# Names that carry no identity themselves: an otherNames match may be accepted behind them.
generic_name_patterns:
  - '^(the\s+)?(study|investigational|trial|active|experimental|test)\s+(drug|product|medication|treatment|agent|compound|intervention|arm)s?$'
  - '^(drug|treatment|intervention|arm|group)\s*[a-z0-9]?$'
  - '^[a-z]{1,6}[\s-]?\d{2,}([\s-]\d+)?$'      # sponsor code, e.g. "BI 10773", "BIA 6-512"

# Systemic exposure (§5.6). Local wins over default-systemic; unclear routes go to review.
local_route_patterns: ['\bstents?\b', '\beluting\b', '\bballoons?\b', '\btopical(ly)?\b', '\bcreams?\b',
  '\bointments?\b', '\bgels?\b', '\blotions?\b', '\beye\s*drops?\b', '\bophthalmic\b', '\bintravitreal\b',
  '\bintracameral\b', '\bintraocular\b', '\bsubconjunctival\b', '\bcorneal\b', '\bintra-?articular\b',
  '\bintralesional\b', '\bmouth\s*(wash|rinse)\b', '\btoothpaste\b', '\bdressings?\b', '\birrigation\b',
  '\bcardioplegi[ac]\b', '\bdermal\b', '\bshampoo\b', '\bvaginal\b', '\bintravesical\b']
unclear_route_patterns: ['\binhal(ed|ation|er)\b', '\bnebuli[sz]ed\b', '\bintrathecal\b', '\brectal\b',
  '\bsuppositor(y|ies)\b', '\benema\b', '\bimplants?\b', '\bnasal\b', '\bintranasal\b']
systemic_route_patterns: ['\btransdermal\b']
local_intervention_types: [DEVICE, PROCEDURE, RADIATION]

# Abbreviations this short are never auto-accepted, even as an exact whole field.
short_code_max_len: 4
# Single-token typo tolerance: edit distance 1 for tokens at least this long -> review only.
fuzzy_min_len: 6

# ---- resolver-v2 (step-4 error classes, docs/step4_precision_result.md) ----------------
#
# ASYMMETRY (SPEC §5.1a): the intervention description may only DISQUALIFY. A match found
# in the name or otherNames that would auto-accept is moved to review if the description
# shows one of these; the description can never move anything towards acceptance.
description_disqualifiers:
  # v3: 'extracted' / 'extraction' (step-4b error: spermidine 'extracted from ... wheat germ')
  extract: '\bextract(s|ed|ion|ions)?\b|\bstandardi[sz]ed\b|\bpolygonum\b|\bknotweed\b|\bconcentrat(e|ed|ion)\b'
  blend: '\bblend(s|ed)?\b|\bmixtures?\b'
  fixed_combination: '\bfixed[- ]dose\b|\bfdc\b|\bfixed[- ]ratio\b|\bco-?formulat\w*|\bcombination (tablets?|pills?|capsules?|products?)\b|\bpolypill\b|\bsingle[- ]pill\b|\bin (one|a single) (tablet|pill|capsule)\b'
  regimen: '\bstep[- ]?(up|wise)\b|\b(add|adds|added|adding)\b(?!\s+(on\s+)?to\b)'

# A single-compound name whose otherNames list another drug is a regimen or a misused field:
# review. "Another drug" = another fixture compound, or an entry carrying one of these INN
# stems while not naming the matched compound itself.
other_drug_stems: ['gliptin', 'gliflozin', 'glutide', 'gli(clazide|pizide|mepiride|benclamide|buride|quidone)',
  'mab\b', 'tinib\b', 'statin\b', 'pril\b', 'sartan\b', 'olol\b', 'xaban\b', 'grel\b', 'parin\b',
  'platin\b', 'taxel\b', 'insulin', 'warfarin', 'folfox', 'mycin\b', 'cillin\b', 'glitazone']

# The name-and-otherNames-agree rule never applies to a name that joins drugs.
# v4: 'plus' joins drugs too ("aspirin plus clopidogrel").
combination_name_pattern: '/|\+|&|\band\b|\bwith\b|\bplus\b|,'

# ---- resolver-v4 (review-queue characterisation, docs/review_queue_composition.md) ------
# All downgrade-only (docs/measurement_policy.md §3): none can add an auto-accept.
#  - "X placebo" names are placebos for X: rejected (resolver.py, placebo_for).
#  - "plus" is a combination separator (combination_name_pattern above; is_combination).
#  - "lithium disilicate" (dental ceramic) is a lithium must_not_match (fixture v0.8.0).

# ---- resolver-v5 (2026-11-18, decided by Kevin Ferguson) --------------------------------
#  - A name starting with "placebo" is a placebo FOR something only when nothing joins it
#    to a drug: "Placebo", "placebo of/for/to X" -> rejected; "Placebo + Metformin",
#    "Placebo plus X", "Placebo with X", "... on background of X" -> placebo_with (review).
#    v1-v4 rejected all of them, silently losing real (mostly background) administrations
#    that the harm path may need. rejected -> review only: cannot add an auto-accept.
